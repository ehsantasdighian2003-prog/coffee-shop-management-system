[tool.black]
line-length = 88
target-version = ["py313"]

exclude = '''
/(
    \.git
  | \.venv
  | migrations
  | alembic/versions
)/
'''


[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["app", "tests"]

skip = [
    "migrations",
    "migrations/versions",
]


[tool.ruff]
line-length = 88
target-version = "py313"

exclude = [
    ".git",
    ".venv",
    "migrations",
    "alembic/versions",
]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]

ignore = [
    "E501",
]