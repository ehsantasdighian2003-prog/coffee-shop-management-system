name: CI - Coffee Shop Backend

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master


jobs:

  quality:

    name: Code Quality

    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black isort


      - name: Run Ruff
        run: |
          ruff check .


      - name: Check Black formatting
        run: |
          black --check .


      - name: Check isort formatting
        run: |
          isort --check-only .



  test:

    name: Tests

    runs-on: ubuntu-latest


    services:

      postgres:

        image: postgres:16

        env:

          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coffee_shop_test


        ports:

          - 5432:5432


        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5



    env:

      DATABASE_NAME: coffee_shop_test
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432

      JWT_SECRET_KEY: test_secret_key
      JWT_ALGORITHM: HS256



    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Wait for PostgreSQL
        run: |
          python - <<'PY'
          import psycopg2
          import time

          for i in range(10):
              try:
                  conn = psycopg2.connect(
                      database="coffee_shop_test",
                      user="postgres",
                      password="postgres",
                      host="localhost",
                      port="5432"
                  )

                  conn.close()

                  print("PostgreSQL is ready")
                  break

              except Exception:
                  print("Waiting for PostgreSQL...")
                  time.sleep(3)

          else:
              raise Exception("PostgreSQL did not start")
          PY


      - name: Run migrations
        run: |
          alembic upgrade head


      - name: Run tests
        run: |
          pytest